[package]
# Port of Create: Hypertube 0.6.0 (PedroRok/CreateHypertubes, commit
# c3b74f52437520b05868b5eb965dc54a45d27602, Apache-2.0). Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md); local-only
# until publishing is approved, publishable under Apache-2.0 with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "create_hypertube"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Create: Hypertube for Horizon: a tube run that carries a player between two entrances"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). No other dependency: the pure runtime
# needs nothing, and a registry crate would have to be pinned with
# `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
